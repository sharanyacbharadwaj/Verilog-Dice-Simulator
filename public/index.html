<!DOCTYPE html>
<html>
<head>
  <title>Verilog Dice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🎲 Verilog Dice Simulator 🎲</h1>
  <button id="rollBtn">Roll Dice</button>
  <div class="led-container" id="leds">
    <div class="led"></div><div class="led"></div><div class="led"></div>
    <div class="led"></div><div class="led"></div><div class="led"></div>
  </div>
  <p id="result"></p>

  <script>
    const leds = document.querySelectorAll(".led");
    const rollBtn = document.getElementById("rollBtn");
    rollBtn.addEventListener("click", async () => {
      leds.forEach(l => l.classList.remove("on"));
      document.getElementById("result").textContent = "Rolling...";
      const res = await fetch("/roll");
      const data = await res.json();
      document.getElementById("result").textContent = `Result: ${data.result}`;
      for (let i = 0; i < data.result; i++) leds[i].classList.add("on");
    });
  </script>
</body>
</html>
